<!DOCTYPE html>
<html>
    <head>

    <title>Register</title>
</head>
<body>
    <center>
        
    <h1>Course Registration🚀</h1>
    <h5>Training | Tech News | Fresh Guide</h5>
    <h6>Empowering young developers to level up their skills through training in software technologies</h6>
</center>
    <hr>
    <center>
        <h1>Registration form</h1>
        <form>
            
            <table>
                <tr>
                    <td>Name:</td> <td><input type="text" placeholder="Enter your name"></td>
                </tr>
                <tr>
                    <td>Age:</td> <td><input type="number" placeholder="Enter your Age"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender">male
                         <input type="radio" name="gender"> female
                    </td>
                </tr>
                <tr>
                    <td>Email:</td> <td><input type="email" placeholder="Enter your email"></td>
                </tr>
                <tr>
                    <td>Select a Course:</td>
                    <td>
                        <select>
                            <option>Python</option>
                            <option>java</option>
                            <option>c++</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload your resume:</td> 
                    
                    <td><input type="file"></td>             
                   </tr>
                   <tr>
                    <td><input type="Reset"></td>
                
                   
                    <td><input type="Submit"></td>
                   </tr>
            </table>
        </form>
    </center>

</body>
</html>
